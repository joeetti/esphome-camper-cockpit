# =====================================================================
#  ESPHome Camper Cockpit – Paket
#  Hardware: Guition JC3248W535 (ESP32-S3, 3,5" 480x320, Touch)
#
#  Diese Datei NICHT anpassen. Alle eigenen Werte (Entitäten, Adresse,
#  Secrets) gehören in deine Gerätedatei, siehe example/cockpit.yaml.
#  Werte aus der Gerätedatei überschreiben die Defaults hier.
# =====================================================================

substitutions:
  # ---- Pflichtwerte: müssen in der Gerätedatei gesetzt werden ----
  # device_name, friendly_name, ha_url, ha_bearer_token,
  # api_encryption_key, wifi_ssid, wifi_password, fallback_password,
  # sowie alle entity_* Werte (siehe docs/home-assistant.md)

  # ---- Optionale Werte mit Defaults ----
  # Wasserwaage mit Live-Schalter: "true", wenn der Neigungssensor zum Stromsparen
  # nur auf Anforderung sendet. Der Schalter wird beim Öffnen der Seite ein- und
  # beim Verlassen ausgeschaltet. Bei "false" wird entity_level_live nicht gebraucht.
  level_live_switch: "false"
  entity_level_live: "switch.cockpit_kein_live_schalter"
  display_title: "CAMPER COCKPIT"
  timezone: "Europe/Berlin"
  # Wasserwaage: Toleranzen in Grad. Die drei Ringe der Libelle stehen genau auf diesen Werten.
  level_green_deg: "0.5"
  level_yellow_deg: "1.5"
  level_max_deg: "3.0"
  # Keilplan: Fahrzeugmaße in cm und Rundung der Keilhöhen.
  track_cm: "180"
  wheelbase_cm: "404"
  wedge_step_cm: "0.5"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "joeetti.esphome-camper-cockpit"
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      - delay: 4s
      - script.execute: refresh_ha

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
api:
  encryption:
    key: "${api_encryption_key}"
  reboot_timeout: 0s
  on_client_connected:
    - script.execute: update_level_ui
  on_client_disconnected:
    - script.execute: update_level_ui
ota:
  - platform: esphome
    # Uploads laufen verschlüsselt mit dem api-Schlüssel; unverschlüsselte Uploads werden abgelehnt.
    encryption:

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  power_save_mode: none
  reboot_timeout: 10min
  on_connect:
    then:
      - lambda: 'id(wifi_online) = true;'
      - logger.log: "WLAN verbunden"
      - delay: 2s
      - script.execute: refresh_ha
  on_disconnect:
    then:
      - lambda: 'id(wifi_online) = false;'
      - logger.log: "WLAN getrennt"
  ap:
    ssid: "${device_name}"
    password: "${fallback_password}"
captive_portal:

external_components:
  # Fest auf einen Commit gepinnt (Stand 14.10.2026), damit Änderungen im Repo den Build nicht brechen.
  # Für ein Update: neuen Commit prüfen und den Hash hier bewusst austauschen.
  - source: github://albert-canfield/esphome-online-video@257a75370c5b5b73d0e06a3ca860237c8941834a
    components: [online_video]

http_request:
  id: ha_http
  timeout: 8s
  follow_redirects: true
  buffer_size_rx: 4096
  buffer_size_tx: 4096

spi:
  - id: display_qspi
    type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

i2c:
  - id: touch_i2c
    sda: 4
    scl: 8

output:
  - platform: ledc
    id: backlight_pwm
    pin: 1

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Hintergrundbeleuchtung"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: main_display
    model: JC3248W535
    spi_id: display_qspi
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: axs15231
    id: main_touchscreen
    i2c_id: touch_i2c
    display: main_display

font:
  - file: "gfonts://Roboto"
    id: font_14
    size: 14
    glyphs: " !%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß°|"
  - file: "gfonts://Roboto"
    id: font_18
    size: 18
    glyphs: " !%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß°|"
  - file: "gfonts://Roboto"
    id: font_24
    size: 24
    glyphs: " !%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß°|"

time:
  - platform: sntp
    id: cockpit_time
    timezone: "${timezone}"

online_video:
  - id: greywater_video
    url: "${ha_url}/api/camera_proxy_stream/${entity_camera}"
    resize: 320x240
    # Seit dem gepinnten Stand ist COVER (Ränder abschneiden) Standard; CONTAIN zeigt wie bisher das ganze Bild.
    fit: CONTAIN
    max_fps: 5
    buffer_size: 150kB
    autostart: false
    headers:
      Authorization: "${ha_bearer_token}"
    on_frame:
      - lvgl.image.update:
          id: camera_view
          src: greywater_video
      # Sobald Bilder kommen, Statustext ausblenden (nur einmal, nicht bei jedem Frame neu setzen).
      - lambda: |-
          if (lv_label_get_text(id(lbl_camera_status))[0] != '\0') {
            lv_label_set_text(id(lbl_camera_status), "");
          }
    on_error:
      - lvgl.label.update:
          id: lbl_camera_status
          text: "STREAM-FEHLER"

globals:
  - {id: booster_on, type: bool, restore_value: no, initial_value: "false"}
  - {id: floodlight_on, type: bool, restore_value: no, initial_value: "false"}
  - {id: esp_cam_on, type: bool, restore_value: no, initial_value: "false"}
  - {id: level_live_on, type: bool, restore_value: no, initial_value: "false"}
  - {id: level_page_active, type: bool, restore_value: no, initial_value: "false"}
  - {id: camera_page_active, type: bool, restore_value: no, initial_value: "false"}
  - {id: wifi_online, type: bool, restore_value: no, initial_value: "false"}
  - {id: ha_error_count, type: int, restore_value: no, initial_value: "0"}
  - {id: last_ha_status, type: int, restore_value: no, initial_value: "0"}
  - {id: last_ha_duration_ms, type: uint32_t, restore_value: no, initial_value: "0"}

binary_sensor:
  - platform: status
    id: cockpit_verbindung
    name: "Cockpit Verbindung"
    device_class: connectivity
    entity_category: diagnostic

  # Wasserwaage: Zustand des Live-Schalters per Push von Home Assistant (kein Polling).
  # Ohne Live-Schalter zeigt die Entität ins Leere und liefert einfach nie einen Wert.
  - platform: homeassistant
    id: level_live_ha
    entity_id: ${entity_level_live}
    on_state:
      - lambda: 'id(level_live_on) = x;'
      - script.execute: update_level_ui

sensor:
  - platform: wifi_signal
    id: cockpit_wifi_rssi
    name: "Cockpit WLAN RSSI"
    update_interval: 30s

  # Wasserwaage: Werte kommen per Push über die native API, sobald sie sich ändern.
  # Nicht verfügbare Entitäten liefern NAN und werden als "--" angezeigt.
  - platform: homeassistant
    id: level_pitch
    entity_id: ${entity_level_pitch}
    on_value: {script.execute: update_level_ui}
  - platform: homeassistant
    id: level_roll
    entity_id: ${entity_level_roll}
    on_value: {script.execute: update_level_ui}
  - platform: homeassistant
    id: level_battery
    entity_id: ${entity_level_battery}
    on_value: {script.execute: update_level_ui}
  - platform: homeassistant
    id: level_voltage
    entity_id: ${entity_level_voltage}
    on_value: {script.execute: update_level_ui}

script:
  - id: refresh_ha
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(camera_page_active) || !id(wifi_online);'
          then:
            - lambda: |-
                if (!id(wifi_online)) {
                  lv_label_set_text(id(lbl_ha), "WLAN OFFLINE");
                }
                ESP_LOGW("cockpit", "HA-Abruf ausgesetzt: Kamera=%s WLAN=%s",
                         id(camera_page_active) ? "aktiv" : "inaktiv",
                         id(wifi_online) ? "online" : "offline");
          else:
            - http_request.post:
                url: "${ha_url}/api/template"
                request_headers:
                  Authorization: "${ha_bearer_token}"
                  Content-Type: application/json
                capture_response: true
                max_response_buffer_size: 8192
                body: >-
                  {"template":"{{ {'booster':states('${entity_booster}'),'battery':states('${entity_battery_soc}'),'battery_unit':state_attr('${entity_battery_soc}','unit_of_measurement') or '','in_a':states('${entity_dcdc_in_current}'),'in_w':states('${entity_dcdc_in_power}'),'out_a':states('${entity_dcdc_out_current}'),'out_w':states('${entity_dcdc_out_power}'),'mode_absorption':states('${entity_dcdc_state_absorption}'),'mode_bulk':states('${entity_dcdc_state_bulk}'),'mode_fault':states('${entity_dcdc_state_fault}'),'mode_float':states('${entity_dcdc_state_float}'),'mode_off':states('${entity_dcdc_state_off}'),'prod_a':states('${entity_production_current}'),'prod_a_unit':state_attr('${entity_production_current}','unit_of_measurement') or '','prod':states('${entity_production_power}'),'prod_unit':state_attr('${entity_production_power}','unit_of_measurement') or '','floodlight':states('${entity_floodlight}'),'esp_cam':states('${entity_camera_power}'),'rssi':states('${entity_camera_rssi}'),'outside_temp':states('${entity_outside_temp}'),'outside_temp_unit':state_attr('${entity_outside_temp}','unit_of_measurement') or '','inside_temp':states('${entity_inside_temp}'),'inside_temp_unit':state_attr('${entity_inside_temp}','unit_of_measurement') or ''} | tojson }}"}
                on_response:
                  then:
                    - lambda: |-
                        id(last_ha_status) = response->status_code;
                        id(last_ha_duration_ms) = response->duration_ms;

                        if (response->status_code != 200) {
                          id(ha_error_count)++;
                          ESP_LOGW("cockpit", "HA HTTP-Fehler: status=%d duration=%lums Folgefehler=%d RSSI=%.0fdBm",
                                   response->status_code,
                                   (unsigned long) response->duration_ms,
                                   id(ha_error_count),
                                   id(cockpit_wifi_rssi).state);
                          if (id(ha_error_count) >= 3) {
                            lv_label_set_text(id(lbl_ha), "WLAN OK | HA OFFLINE");
                          }
                          return;
                        }

                        id(ha_error_count) = 0;
                        char diag[64];
                        // Kurzform, damit sie in das 168 px breite Feld passt (Status 200 steckt schon im "HA").
                        snprintf(diag, sizeof(diag), "HA %lums | %.0fdBm",
                                 (unsigned long) response->duration_ms,
                                 id(cockpit_wifi_rssi).state);
                        lv_label_set_text(id(lbl_ha), diag);
                        ESP_LOGI("cockpit", "HA OK: status=%d duration=%lums RSSI=%.0fdBm",
                                 response->status_code,
                                 (unsigned long) response->duration_ms,
                                 id(cockpit_wifi_rssi).state);

                        const bool parsed = json::parse_json(body, [](JsonObject r) -> bool {
                          auto txt = [](JsonVariant v) { return std::string(v | "--"); };
                          // Liefert NAN, wenn der Zustand keine Zahl ist (z. B. "unavailable" oder "unknown").
                          auto num = [](JsonVariant v) -> float {
                            const char *s = v | "";
                            char *end = nullptr;
                            float f = strtof(s, &end);
                            if (end == s) return NAN;
                            while (*end == ' ') end++;
                            return *end == '\0' ? f : NAN;
                          };
                          // Formatiert eine Zahl, oder "--" wenn sie fehlt.
                          auto fmt = [](char *o, size_t n, const char *f, float x) {
                            if (std::isnan(x)) snprintf(o, n, "--");
                            else snprintf(o, n, f, x);
                          };

                          id(booster_on) = txt(r["booster"]) == "on";
                          id(floodlight_on) = txt(r["floodlight"]) == "on";
                          id(esp_cam_on) = txt(r["esp_cam"]) == "on";

                          lv_label_set_text(id(lbl_booster), id(booster_on) ? "EIN" : "AUS");
                          lv_obj_set_style_text_color(id(lbl_booster), lv_color_hex(id(booster_on) ? 0x63D471 : 0xFFFFFF), LV_PART_MAIN);
                          lv_obj_set_style_bg_color(id(booster_switch_bg), lv_color_hex(id(booster_on) ? 0x63D471 : 0x4A5560), LV_PART_MAIN);
                          lv_obj_set_x(id(booster_switch_knob), id(booster_on) ? 33 : 3);

                          lv_label_set_text(id(lbl_floodlight), id(floodlight_on) ? "FLUTLICHT EIN" : "FLUTLICHT AUS");
                          lv_label_set_text(id(lbl_live_light), id(floodlight_on) ? "FLUTLICHT EIN" : "FLUTLICHT AUS");
                          lv_label_set_text(id(lbl_esp_cam), id(esp_cam_on) ? "KAMERA EIN" : "KAMERA AUS");
                          lv_obj_set_style_bg_color(id(btn_esp_cam), lv_color_hex(id(esp_cam_on) ? 0x2F7D4A : 0x192630), LV_PART_MAIN);
                          lv_obj_set_style_bg_color(id(btn_floodlight), lv_color_hex(id(floodlight_on) ? 0x8A6A16 : 0x192630), LV_PART_MAIN);

                          char b[120], v1[16], v2[16];
                          float soc = num(r["battery"]);
                          if (std::isnan(soc)) {
                            lv_label_set_text(id(lbl_battery), "-- %");
                            lv_obj_set_width(id(battery_fill), 0);
                            lv_obj_set_style_text_color(id(lbl_battery), lv_color_hex(0xAAB8C2), LV_PART_MAIN);
                          } else {
                            float soc_clamped = fmax(0.0f, fmin(100.0f, soc));
                            snprintf(b, sizeof(b), "%.0f %%", soc_clamped);
                            lv_label_set_text(id(lbl_battery), b);
                            int fill_w = (int) roundf(91.0f * soc_clamped / 100.0f);
                            lv_obj_set_width(id(battery_fill), fill_w);
                            uint32_t bc = soc_clamped < 20.0f ? 0xFF5C5C : (soc_clamped < 50.0f ? 0xFFCC48 : 0x63D471);
                            lv_obj_set_style_bg_color(id(battery_fill), lv_color_hex(bc), LV_PART_MAIN);
                            lv_obj_set_style_text_color(id(lbl_battery), lv_color_hex(bc), LV_PART_MAIN);
                          }

                          fmt(v1, sizeof(v1), "%.1f", num(r["in_a"]));
                          fmt(v2, sizeof(v2), "%.0f", num(r["in_w"]));
                          snprintf(b, sizeof(b), "IN %s A | %s W", v1, v2);
                          lv_label_set_text(id(lbl_input), b);
                          fmt(v1, sizeof(v1), "%.1f", num(r["out_a"]));
                          fmt(v2, sizeof(v2), "%.0f", num(r["out_w"]));
                          snprintf(b, sizeof(b), "OUT %s A | %s W", v1, v2);
                          lv_label_set_text(id(lbl_output), b);

                          std::string mode = "UNBEKANNT";
                          uint32_t mc = 0xAAB8C2;
                          if (txt(r["mode_fault"]) == "on") { mode = "FEHLER"; mc = 0xFF5C5C; }
                          else if (txt(r["mode_bulk"]) == "on") { mode = "BULK"; mc = 0xFFCC48; }
                          else if (txt(r["mode_absorption"]) == "on") { mode = "ABSORPTION"; mc = 0x53BDEC; }
                          else if (txt(r["mode_float"]) == "on") { mode = "FLOAT"; mc = 0x63D471; }
                          else if (txt(r["mode_off"]) == "on") { mode = "AUS"; mc = 0xAAB8C2; }
                          lv_label_set_text(id(lbl_dcdc_mode), mode.c_str());
                          lv_obj_set_style_text_color(id(lbl_dcdc_mode), lv_color_hex(mc), LV_PART_MAIN);

                          float temp = num(r["outside_temp"]);
                          if (std::isnan(temp)) snprintf(b, sizeof(b), "--");
                          else snprintf(b, sizeof(b), "%.1f %s", temp, txt(r["outside_temp_unit"]).c_str());
                          lv_label_set_text(id(lbl_outside_temp), b);
                          float temp_in = num(r["inside_temp"]);
                          if (std::isnan(temp_in)) snprintf(b, sizeof(b), "--");
                          else snprintf(b, sizeof(b), "%.1f %s", temp_in, txt(r["inside_temp_unit"]).c_str());
                          lv_label_set_text(id(lbl_inside_temp), b);
                          fmt(v1, sizeof(v1), "%.1f", num(r["prod_a"]));
                          fmt(v2, sizeof(v2), "%.1f", num(r["prod"]));
                          snprintf(b, sizeof(b), "STROMPRODUKTION GESAMT %s %s | %s %s",
                                   v1, txt(r["prod_a_unit"]).c_str(),
                                   v2, txt(r["prod_unit"]).c_str());
                          lv_label_set_text(id(lbl_production), b);
                          fmt(v1, sizeof(v1), "%.0f", num(r["rssi"]));
                          snprintf(b, sizeof(b), "KAMERA-WLAN %s dBm", v1);
                          lv_label_set_text(id(lbl_rssi), b);

                          return true;
                        });

                        if (!parsed) {
                          id(ha_error_count)++;
                          ESP_LOGW("cockpit", "HA JSON konnte nicht ausgewertet werden");
                          if (id(ha_error_count) >= 3) {
                            lv_label_set_text(id(lbl_ha), "HA JSON FEHLER");
                          }
                        }
                on_error:
                  then:
                    - lambda: |-
                        id(ha_error_count)++;
                        ESP_LOGW("cockpit", "HA Transportfehler: Folgefehler=%d WLAN=%s RSSI=%.0fdBm",
                                 id(ha_error_count),
                                 id(wifi_online) ? "online" : "offline",
                                 id(cockpit_wifi_rssi).state);
                    - if:
                        condition:
                          lambda: 'return !id(wifi_online);'
                        then:
                          - lvgl.label.update:
                              id: lbl_ha
                              text: "WLAN OFFLINE"
                        else:
                          - if:
                              condition:
                                lambda: 'return id(ha_error_count) >= 3;'
                              then:
                                - lvgl.label.update:
                                    id: lbl_ha
                                    text: "WLAN OK | HA OFFLINE"

  - id: toggle_booster
    then:
      - http_request.post:
          url: !lambda 'return std::string("${ha_url}/api/services/homeassistant/") + (id(booster_on) ? "turn_off" : "turn_on");'
          request_headers: {Authorization: "${ha_bearer_token}", Content-Type: application/json}
          body: '{"entity_id":"${entity_booster}"}'
      - delay: 500ms
      - script.execute: refresh_ha

  - id: toggle_floodlight
    then:
      - http_request.post:
          url: !lambda 'return std::string("${ha_url}/api/services/homeassistant/") + (id(floodlight_on) ? "turn_off" : "turn_on");'
          request_headers: {Authorization: "${ha_bearer_token}", Content-Type: application/json}
          body: '{"entity_id":"${entity_floodlight}"}'
      - delay: 500ms
      - script.execute: refresh_ha

  - id: toggle_esp_cam
    then:
      - http_request.post:
          url: !lambda 'return std::string("${ha_url}/api/services/homeassistant/") + (id(esp_cam_on) ? "turn_off" : "turn_on");'
          request_headers: {Authorization: "${ha_bearer_token}", Content-Type: application/json}
          body: '{"entity_id":"${entity_camera_power}"}'
      - delay: 800ms
      - script.execute: refresh_ha

  - id: set_level_live_on
    mode: restart
    then:
      # Ohne Live-Schalter (level_live_switch: "false") passiert hier nichts.
      - if:
          condition:
            lambda: 'return ${level_live_switch};'
          then:
            - http_request.post:
                url: "${ha_url}/api/services/homeassistant/turn_on"
                request_headers: {Authorization: "${ha_bearer_token}", Content-Type: application/json}
                body: '{"entity_id":"${entity_level_live}"}'
      - lambda: 'id(level_live_on) = true;'
      - script.execute: update_level_ui

  - id: set_level_live_off
    mode: restart
    then:
      # Ohne Live-Schalter (level_live_switch: "false") passiert hier nichts.
      - if:
          condition:
            lambda: 'return ${level_live_switch};'
          then:
            - http_request.post:
                url: "${ha_url}/api/services/homeassistant/turn_off"
                request_headers: {Authorization: "${ha_bearer_token}", Content-Type: application/json}
                body: '{"entity_id":"${entity_level_live}"}'
      - lambda: 'id(level_live_on) = false;'
      - script.execute: update_level_ui

  # Zeichnet die Wasserwaage aus den Push-Werten. Kein HTTP, blockiert also nichts.
  - id: update_level_ui
    then:
      - lambda: |-
          if (!id(level_page_active)) return;

          const float T_GREEN = (float) ${level_green_deg};
          const float T_YELLOW = (float) ${level_yellow_deg};
          const float T_MAX = (float) ${level_max_deg};
          // Radien der gezeichneten Ringe in Pixeln (Mitte der Blase).
          const float R_GREEN = 35.0f, R_YELLOW = 70.0f, R_MAX = 80.0f;
          auto zone = [&](float t) -> uint32_t {
            return t <= T_GREEN ? 0x63D471 : (t <= T_YELLOW ? 0xFFCC48 : 0xFF5C5C);
          };

          const bool api_ok = api::global_api_server->is_connected();
          float pitch = api_ok ? id(level_pitch).state : NAN;
          float roll = api_ok ? id(level_roll).state : NAN;
          float bat = api_ok ? id(level_battery).state : NAN;
          float volt = api_ok ? id(level_voltage).state : NAN;

          if (!api_ok) {
            lv_label_set_text(id(lbl_level_live), "API GETRENNT");
            lv_obj_set_style_text_color(id(lbl_level_live), lv_color_hex(0xFF5C5C), LV_PART_MAIN);
          } else {
            if (${level_live_switch}) {
              lv_label_set_text(id(lbl_level_live), id(level_live_on) ? "LIVE EIN" : "LIVE AUS");
              lv_obj_set_style_text_color(id(lbl_level_live), lv_color_hex(id(level_live_on) ? 0x63D471 : 0xAAB8C2), LV_PART_MAIN);
            } else {
              // Ohne Live-Schalter gibt es keinen Modus anzuzeigen.
              lv_label_set_text(id(lbl_level_live), "");
            }
          }

          char b[48], sb[16], sv[16];
          if (std::isnan(pitch)) snprintf(b, sizeof(b), "-- °"); else snprintf(b, sizeof(b), "%+.2f °", pitch);
          lv_label_set_text(id(lbl_pitch), b);
          lv_obj_set_style_text_color(id(lbl_pitch), lv_color_hex(std::isnan(pitch) ? 0xAAB8C2 : zone(fabsf(pitch))), LV_PART_MAIN);
          if (std::isnan(roll)) snprintf(b, sizeof(b), "-- °"); else snprintf(b, sizeof(b), "%+.2f °", roll);
          lv_label_set_text(id(lbl_roll), b);
          lv_obj_set_style_text_color(id(lbl_roll), lv_color_hex(std::isnan(roll) ? 0xAAB8C2 : zone(fabsf(roll))), LV_PART_MAIN);

          if (std::isnan(bat)) snprintf(sb, sizeof(sb), "--"); else snprintf(sb, sizeof(sb), "%.0f", bat);
          if (std::isnan(volt)) snprintf(sv, sizeof(sv), "--"); else snprintf(sv, sizeof(sv), "%.3f", volt);
          snprintf(b, sizeof(b), "BAT %s %% | %s V", sb, sv);
          lv_label_set_text(id(lbl_level_battery), b);

          // Keilplan: Wie viel muss jedes Rad angehoben werden, damit das Fahrzeug waagerecht steht?
          // Annahme wie in der HA-Karte: Längsneigung positiv = vorn hoch, Querneigung positiv = rechts hoch.
          {
            const float TRACK = (float) ${track_cm}, WB = (float) ${wheelbase_cm}, STEP = (float) ${wedge_step_cm};
            lv_obj_t *wl[4] = {id(lbl_wedge_fl), id(lbl_wedge_fr), id(lbl_wedge_rl), id(lbl_wedge_rr)};
            if (std::isnan(pitch) || std::isnan(roll)) {
              for (auto *l : wl) {
                lv_label_set_text(l, "--");
                lv_obj_set_style_text_color(l, lv_color_hex(0xAAB8C2), LV_PART_MAIN);
              }
            } else {
              const float D2R = 3.14159265f / 180.0f;
              float dz_front = WB * tanf(pitch * D2R);    // Höhe der Vorderachse über der Hinterachse
              float dz_right = TRACK * tanf(roll * D2R);  // Höhe rechts über links
              // Relative Höhe jedes Rades: vorn links, vorn rechts, hinten links, hinten rechts
              float z[4] = {dz_front, dz_front + dz_right, 0.0f, dz_right};
              float zmax = fmaxf(fmaxf(z[0], z[1]), fmaxf(z[2], z[3]));
              for (int i = 0; i < 4; i++) {
                // Das höchste Rad bleibt bei 0, alle anderen werden auf seine Höhe gebracht.
                float lift = roundf((zmax - z[i]) / STEP) * STEP;
                char w[16];
                if (lift <= 0.0f) {
                  snprintf(w, sizeof(w), "0");
                } else {
                  snprintf(w, sizeof(w), "%.1f", lift);
                  size_t n = strlen(w);
                  if (n >= 2 && w[n - 2] == '.' && w[n - 1] == '0') w[n - 2] = '\0';  // "1.0" -> "1"
                  for (char *c = w; *c; c++) if (*c == '.') *c = ',';                 // deutsches Komma
                  strncat(w, " cm", sizeof(w) - strlen(w) - 1);
                }
                lv_label_set_text(wl[i], w);
                lv_obj_set_style_text_color(wl[i], lv_color_hex(lift <= 0.0f ? 0xAAB8C2 : 0xF08A4B), LV_PART_MAIN);
              }
            }
          }

          if (std::isnan(pitch) || std::isnan(roll)) {
            // Keine Daten: Blase grau in die Mitte.
            lv_obj_set_pos(id(level_bubble), 85, 85);
            lv_obj_set_style_bg_color(id(level_bubble), lv_color_hex(0x56636D), LV_PART_MAIN);
            return;
          }

          // Gesamtneigung (Kreise sind rund, also zählt der Abstand zur Mitte).
          float tilt = sqrtf(pitch * pitch + roll * roll);
          // Abschnittsweise Skala: 0..grün -> innerer Ring, grün..gelb -> mittlerer Ring, gelb..max -> Rand.
          float rpx;
          if (tilt <= T_GREEN) rpx = tilt / T_GREEN * R_GREEN;
          else if (tilt <= T_YELLOW) rpx = R_GREEN + (tilt - T_GREEN) / (T_YELLOW - T_GREEN) * (R_YELLOW - R_GREEN);
          else rpx = R_YELLOW + fminf(tilt - T_YELLOW, T_MAX - T_YELLOW) / (T_MAX - T_YELLOW) * (R_MAX - R_YELLOW);
          float dx = 0.0f, dy = 0.0f;
          if (tilt > 0.0001f) {
            dx = roll / tilt * rpx;
            dy = -pitch / tilt * rpx;
          }
          lv_obj_set_pos(id(level_bubble), 85 + (int) roundf(dx), 85 + (int) roundf(dy));
          lv_obj_set_style_bg_color(id(level_bubble), lv_color_hex(zone(tilt)), LV_PART_MAIN);

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto now = id(cockpit_time).now();
          if (now.is_valid()) {
            char t[6];
            snprintf(t, sizeof(t), "%02d:%02d", now.hour, now.minute);
            lv_label_set_text(id(lbl_time), t);
          }
  - interval: 20s
    then:
      - script.execute: refresh_ha

